name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run check:release
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify packed extension loads
        shell: bash
        run: |
          npm pack --json --ignore-scripts > pack.json
          package_file=$(node -e 'const p=require("./pack.json"); process.stdout.write(p[0].filename)')
          package_dir=$(mktemp -d)
          trap 'rm -rf "$package_dir" "$package_file" pack.json' EXIT
          tar -xzf "$package_file" -C "$package_dir"
          ./node_modules/.bin/pi --offline \
            --no-extensions --no-skills --no-prompt-templates --no-context-files \
            -e "$package_dir/package/extensions/x-search.ts" \
            --list-models xai
