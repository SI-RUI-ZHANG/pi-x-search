<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="pi-x-search terminal demo: an X search returning a verbatim post quote followed by the post's URL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- title block -->
  <text x="80" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="46" font-weight="700" fill="#e6edf3">pi-x-search</text>
  <text x="80" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#8b949e">quote the post, not the summary</text>

  <!-- terminal window -->
  <rect x="80" y="196" width="1040" height="368" rx="14" fill="#010409" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="112" cy="228" r="7" fill="#ff5f56"/>
  <circle cx="136" cy="228" r="7" fill="#ffbd2e"/>
  <circle cx="160" cy="228" r="7" fill="#27c93f"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19">
    <!-- pi's chevron prompt, drawn as a path so it renders without the terminal font -->
    <path d="M 113.5 274.5 L 121 281.5 L 113.5 288.5" fill="none" stroke="#58a6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="135" y="286" fill="#58a6ff">Search X for what people are saying about the Responses API</text>

    <text x="112" y="322" fill="#3fb950">9 sources · 4 search calls · Grok subscription</text>

    <text x="112" y="368" fill="#c9d1d9">“the annotations carry the source URLs. the top-level citations</text>
    <text x="112" y="394" fill="#c9d1d9">field has been null in every response i have seen.”</text>
    <text x="112" y="420" fill="#58a6ff">https://x.com/i/status/1951…</text>

    <text x="112" y="462" fill="#c9d1d9">“it reads the video attached to a post. web search cannot do that.”</text>
    <text x="112" y="488" fill="#58a6ff">https://x.com/i/status/1950…</text>

    <text x="112" y="532" fill="#484f58">every quote keeps its link · an answer that never searched is rejected</text>
  </g>
</svg>
